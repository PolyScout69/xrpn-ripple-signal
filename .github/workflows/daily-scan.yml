name: Signal daily investor scan and GitHub Pages

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signal-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install news-scanner dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Scan issuer and ecosystem news
        id: scan
        continue-on-error: true
        run: python scripts/scan.py
      - name: Save current news snapshot
        run: |
          git config user.name signal-news-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: daily source-first investor news refresh'
            git push
          fi
      - name: Package static website
        run: |
          mkdir -p dist
          cp index.html styles.css app.js dist/
          cp -r data assets dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment