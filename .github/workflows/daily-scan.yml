name: Signal three daily investor scans and GitHub Pages

on:
  schedule:
    # 09:15 UTC: UK and continental European morning company releases.
    # 14:35 UTC: US pre-market/early-market press.
    # 23:35 UTC: US market close + evening company announcements.
    # Scans run at fixed UTC times; scheduled jobs may be delayed by GitHub.
    - cron: '15 9 * * *'
    - cron: '35 14 * * *'
    - cron: '35 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: signal-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued scans must start from the latest snapshot commit.
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install news-scanner dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Scan company investor news
        id: scan
        continue-on-error: true
        run: python scripts/scan.py
      - name: Save current news snapshot
        run: |
          git config user.name signal-news-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: daily source-first investor news refresh'
            git push
          fi
      - name: Package static website
        run: |
          mkdir -p dist
          cp index.html styles.css app.js dist/
          cp -r data assets dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
